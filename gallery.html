<main><div class="container"><header class="page-heading"><h1>Gallery</h1><p>Explore the food photography, menu concepts and visual identity behind Tang Real Flame Grilled. Select any card to learn more.</p></header>
<div class="gallery-grid">
<figure class="gallery-item"><img src="./images/tang-gallery.jpg" alt="Flame-grilled chicken with fries and salad"><figcaption>Flame-grilled favourites</figcaption><details class="gallery-details"><summary>View details</summary><p>Our food imagery highlights flame-grilled chicken served with familiar sides. The warm, hearty presentation communicates a casual meal made for sharing or enjoying on your own.</p></details></figure>
<figure class="gallery-item"><img src="./images/tang-menu.png" alt="Tang menu concept with food photography"><figcaption>Menu presentation</figcaption><details class="gallery-details"><summary>View details</summary><p>The menu concept brings dishes and food photography together in a clear visual layout, helping visitors scan the selection and find items that interest them. Menu content shown here is illustrative.</p></details></figure>
<figure class="gallery-item"><img src="./images/tang-home.png" alt="Tang Real Flame Grilled brand concept"><figcaption>Brand identity</figcaption><details class="gallery-details"><summary>View details</summary><p>The brand direction uses deep green, warm gold and cream to create a welcoming restaurant identity. The flame motif connects the visual style to the real-flame grilling theme.</p></details></figure>
<figure class="gallery-item"><img src="./images/tang-gallery.jpg" alt="Grilled chicken dish project image"><figcaption>Signature grill</figcaption><details class="gallery-details"><summary>View details</summary><p>The signature-grill concept focuses on char-grilled flavour and an appetising serving style. This image represents the restaurant's food presentation direction rather than a verified product listing.</p></details></figure>
<figure class="gallery-item"><img src="./images/tang-menu.png" alt="Food and menu concept image"><figcaption>Food selection</figcaption><details class="gallery-details"><summary>View details</summary><p>The food-selection concept groups dishes in a way that can make the menu easier to browse. Customers should confirm current ingredients, prices and availability with the restaurant.</p></details></figure>
<figure class="gallery-item"><img src="./images/tang-home.png" alt="Tang Real Flame Grilled visual concept"><figcaption>Restaurant visual direction</figcaption><details class="gallery-details"><summary>View details</summary><p>Consistent colours, imagery and typography give the site a unified feel across Home, Menu, About, Gallery and Contact. The responsive layout is designed to work on desktop and mobile screens.</p></details></figure>
